name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      # Das Projekt liegt als project.yml im Repo, nicht als .xcodeproj.
      - name: Projekt erzeugen
        run: xcodegen generate

      # Ad-hoc signieren: project.yml verlangt für die Entwicklung ein
      # Zertifikat des Teams, das auf einem Runner nicht existiert. Für Tests
      # genügt eine Ad-hoc-Signatur — die Tests fassen weder Keychain noch
      # Berechtigungen an.
      - name: Tests
        run: |
          set -o pipefail
          xcodebuild -project AGFEOPresenceBridge.xcodeproj \
            -scheme AGFEOPresenceBridge \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            test
