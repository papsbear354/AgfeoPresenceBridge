name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**"]

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      # .NET 10 ist der aktuelle Langzeit-Stand (unterstützt bis November 2028).
      # .NET 8 läuft im November 2026 aus, .NET 9 ist bereits ausgelaufen.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Der Kern ist plattformneutral und läuft überall; die Oberfläche
      # braucht Windows und wird deshalb hier gebaut.
      - name: Tests
        run: dotnet test tests/AgfeoPresenceBridge.Core.Tests --verbosity minimal

      # Mit eigener Laufzeitumgebung: Die Datei wird dadurch groß, läuft aber
      # ohne vorher installiertes .NET — das zählt beim Weitergeben mehr als
      # die Dateigröße. Komprimiert, damit es nicht ausufert.
      - name: Programm bauen
        run: >
          dotnet publish src/AgfeoPresenceBridge.Windows
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Inhalt zeigen
        run: Get-ChildItem publish | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: AgfeoPresenceBridge-windows
          path: windows/publish
