name: Release

# Ausgelöst durch einen Versions-Tag: git tag v1.8.0 && git push --tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Version aus dem Tag ableiten
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Ohne hinterlegtes Zertifikat entsteht ein unsigniertes Bündel. Das ist
      # gewollt: Ein Fork ohne Zugänge soll bauen können, statt zu scheitern.
      - name: Signaturzertifikat einspielen
        if: env.CERTIFICATE != ''
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Zugang für die Notarisierung hinterlegen
        if: env.NOTARY_PASSWORD != ''
        env:
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials release \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "$NOTARY_PASSWORD"

      - name: Bauen, signieren, notarisieren
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PASSWORD != '' && 'release' || '' }}
        run: Scripts/build-release.sh "${{ steps.version.outputs.value }}"

      - name: Veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true
          body: |
            **macOS** — DMG öffnen, App nach „Programme“ ziehen, starten.
            Signiert und notariell beglaubigt; ab macOS 13.

            **Windows** — die EXE herunterladen und starten. Sie bringt alles
            mit, eine .NET-Installation ist nicht nötig. Windows zeigt beim
            ersten Start eine SmartScreen-Warnung, weil die Datei nicht
            signiert ist: „Weitere Informationen“ → „Trotzdem ausführen“.

            Die Einrichtung führt beim ersten Start durch die nötigen Schritte.

  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version aus dem Tag ableiten
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Kein Release aus rotem Stand.
      - name: Tests
        run: dotnet test tests/AgfeoPresenceBridge.Core.Tests --verbosity minimal

      # Mit eigener Laufzeitumgebung, damit die Datei ohne vorinstalliertes
      # .NET läuft — beim Weitergeben zählt das mehr als die Dateigröße.
      - name: Programm bauen
        run: >
          dotnet publish src/AgfeoPresenceBridge.Windows
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Umbenennen
        shell: pwsh
        run: |
          Move-Item publish/AgfeoPresenceBridge.exe `
            "publish/AgfeoPresenceBridge-${{ steps.version.outputs.value }}-win-x64.exe"
          Get-ChildItem publish | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: windows/publish/*.exe
